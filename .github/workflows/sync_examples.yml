name: Sync Examples From Provider
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5'

jobs:
  Sync:
    if: github.repository_owner == 'alibabacloud-automation'
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Terraform & Terraform-docs
        run: |
          if [ ! -f /usr/local/bin/terraform ]; then
            wget -q https://releases.hashicorp.com/terraform/1.6.0/terraform_1.6.0_linux_amd64.zip
            unzip terraform_1.6.0_linux_amd64.zip -d /usr/local/bin/
          fi

          mkdir terraform-docs && cd terraform-docs
          curl -sSLo ./terraform-docs.tar.gz https://terraform-docs.io/dl/v0.19.0/terraform-docs-v0.19.0-$(uname)-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/
          cd ..
          rm -rf terraform-docs
          terraform-docs version

      - name: sync examples
        id: sync_examples
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          release=$(curl --fail --silent --show-error --retry 3 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/aliyun/terraform-provider-alicloud/releases/latest)
          if ! version=$(jq -er '.tag_name | strings | select(length > 0)' <<< "$release"); then
              echo '::error::The latest Provider release is missing a valid tag_name.'
              exit 1
          fi
          if ! published_date=$(jq -er '.published_at | strings | select(length > 0)' <<< "$release") ||
              ! published_timestamp=$(date -d "$published_date" +%s); then
              echo '::error::The latest Provider release is missing a valid published_at.'
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          current_time=$(date +%s)
          time_diff=$(( (current_time - published_timestamp) / (60*60*24) ))

          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$time_diff" -gt 7 ]; then
              echo "no update"
              echo "update=false" >> "$GITHUB_OUTPUT"
          else
              release_notes=$(mktemp "$RUNNER_TEMP/provider-release-notes.XXXXXX")
              if ! jq -er '.body | strings' <<< "$release" > "$release_notes"; then
                  echo "::error::Provider release $version is missing its release notes."
                  exit 1
              fi
              git clone -b "$version" https://github.com/aliyun/terraform-provider-alicloud.git terraform-provider-alicloud
              go run scripts/sync_examples_from_provider.go "$version" "$release_notes"
              bash scripts/doc-generate.sh quickstarts >> /dev/null
              rm -rf terraform-provider-alicloud
              echo "update=true" >> "$GITHUB_OUTPUT"
          fi


      - name: Commit & Push changes
        if: steps.sync_examples.outputs.update == 'true'
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          message: 'sync examples from Provider ${{ steps.sync_examples.outputs.version }}'
          branch: ${{ github.ref_name }}

